<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Scoutly: find the companies that move your business forward">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#111a33"/></linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.2" r="0.6"><stop offset="0" stop-color="#818cf8" stop-opacity="0.35"/><stop offset="1" stop-color="#818cf8" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="24" fill="url(#glow)"/>
  <!-- network of companies -->
  <g stroke="#2a3558" stroke-width="1.5" fill="none">
    <path d="M820 120 L930 80 L1040 150 L980 250 L860 230 Z"/><path d="M930 80 L980 250"/><path d="M820 120 L860 230"/><path d="M1040 150 L1110 260 L980 250"/><path d="M860 230 L900 330 L980 250"/>
  </g>
  <g fill="#1a2447" stroke="#3b4a80" stroke-width="1.5">
    <circle cx="820" cy="120" r="14"/><circle cx="930" cy="80" r="12"/><circle cx="1040" cy="150" r="14"/><circle cx="860" cy="230" r="12"/><circle cx="1110" cy="260" r="10"/><circle cx="900" cy="330" r="10"/>
  </g>
  <circle cx="980" cy="250" r="30" fill="#34d399" fill-opacity="0.15"/>
  <circle cx="980" cy="250" r="20" fill="url(#ac)"/>
  <path d="M972 250 l6 6 l11 -12" stroke="#0b1020" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="1040" cy="150" r="8" fill="#34d399"/><circle cx="930" cy="80" r="7" fill="#818cf8"/>
  <!-- text -->
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
    <text x="64" y="86" font-size="20" font-weight="700" letter-spacing="4" fill="#34d399">SCOUTLY</text>
    <text x="64" y="160" font-size="50" font-weight="800" fill="#f5f7ff">Find the companies that</text>
    <text x="64" y="218" font-size="50" font-weight="800" fill="url(#ac)">move your business forward.</text>
    <text x="64" y="266" font-size="22" fill="#a9b4d6">Your AI-powered partner for finding your next customers,</text>
    <text x="64" y="296" font-size="22" fill="#a9b4d6">design partners and strategic partners.</text>
    <g font-size="15" font-weight="600">
      <rect x="64" y="332" width="112" height="34" rx="17" fill="#16203f" stroke="#34d399" stroke-opacity="0.5"/><text x="120" y="354" text-anchor="middle" fill="#bff5df">Customers</text>
      <rect x="188" y="332" width="150" height="34" rx="17" fill="#16203f" stroke="#818cf8" stroke-opacity="0.6"/><text x="263" y="354" text-anchor="middle" fill="#d0d4ff">Design partners</text>
      <rect x="350" y="332" width="158" height="34" rx="17" fill="#16203f" stroke="#34d399" stroke-opacity="0.5"/><text x="429" y="354" text-anchor="middle" fill="#bff5df">Strategic partners</text>
      <rect x="520" y="332" width="130" height="34" rx="17" fill="#16203f" stroke="#818cf8" stroke-opacity="0.6"/><text x="585" y="354" text-anchor="middle" fill="#d0d4ff">Early adopters</text>
    </g>
  </g>
</svg>
