<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-label="Illustrative Slack conversation: a GTM teammate asks Scoutly for design partners and gets a ranked shortlist">
  <defs><linearGradient id="ac" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#818cf8"/></linearGradient></defs>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <rect width="900" height="600" rx="20" fill="#0f1530"/>
  <rect width="900" height="52" rx="20" fill="#16203f"/><rect y="30" width="900" height="22" fill="#16203f"/>
  <circle cx="28" cy="26" r="6" fill="#ff5f57"/><circle cx="50" cy="26" r="6" fill="#febc2e"/><circle cx="72" cy="26" r="6" fill="#28c840"/>
  <text x="450" y="31" text-anchor="middle" font-size="15" font-weight="600" fill="#c9d2f0"># gtm-team  ·  Scoutly connected</text>
  <!-- user msg -->
  <circle cx="44" cy="96" r="18" fill="#3b4a80"/><text x="44" y="102" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">A</text>
  <text x="74" y="92" font-size="14" font-weight="700" fill="#e8ecff">Aanya <tspan font-weight="400" fill="#7d89b3">· GTM lead</tspan></text>
  <rect x="74" y="102" width="760" height="58" rx="12" fill="#1a2447"/>
  <text x="92" y="127" font-size="15" fill="#dfe5ff">Find 30 YC-backed US fintech startups under 50 people that could be</text>
  <text x="92" y="148" font-size="15" fill="#dfe5ff">design partners for our AI compliance product.</text>
  <!-- scoutly -->
  <rect x="26" y="186" width="36" height="36" rx="10" fill="url(#ac)"/>
  <circle cx="44" cy="204" r="8" fill="none" stroke="#0b1020" stroke-width="3"/><path d="M50 210 l6 6" stroke="#0b1020" stroke-width="3" stroke-linecap="round"/>
  <text x="74" y="200" font-size="14" font-weight="700" fill="#e8ecff">Scoutly <tspan font-size="11" fill="#0b1020" font-weight="700"> </tspan><tspan font-weight="400" fill="#34d399">· APP</tspan></text>
  <text x="74" y="226" font-size="15" fill="#dfe5ff">I found 30 matches and ranked them by fit. Here are the first three worth a conversation:</text>
  <!-- cards -->
  <g>
    <rect x="74" y="244" width="760" height="86" rx="12" fill="#141c3b" stroke="#2a3558"/>
    <rect x="74" y="244" width="5" height="86" rx="2" fill="#34d399"/>
    <text x="98" y="272" font-size="16" font-weight="700" fill="#f5f7ff">Company A</text><text x="98" y="294" font-size="14" fill="#a9b4d6">Fintech infrastructure · 25 people · Series A</text>
    <text x="98" y="316" font-size="13" fill="#7d89b3">Why: ships regulated payment flows, small team, no compliance tooling in stack</text>
    <rect x="690" y="258" width="130" height="28" rx="14" fill="#0e3a2e"/><text x="755" y="277" text-anchor="middle" font-size="13" font-weight="700" fill="#34d399">Design partner</text>
  </g>
  <g>
    <rect x="74" y="342" width="760" height="86" rx="12" fill="#141c3b" stroke="#2a3558"/>
    <rect x="74" y="342" width="5" height="86" rx="2" fill="#818cf8"/>
    <text x="98" y="370" font-size="16" font-weight="700" fill="#f5f7ff">Company B</text><text x="98" y="392" font-size="14" fill="#a9b4d6">B2B financial software · 38 people · Seed</text>
    <text x="98" y="414" font-size="13" fill="#7d89b3">Why: sells to banks, growing audit surface, recent funding</text>
    <rect x="708" y="356" width="112" height="28" rx="14" fill="#232a5c"/><text x="764" y="375" text-anchor="middle" font-size="13" font-weight="700" fill="#a5adff">Customer</text>
  </g>
  <g>
    <rect x="74" y="440" width="760" height="86" rx="12" fill="#141c3b" stroke="#2a3558"/>
    <rect x="74" y="440" width="5" height="86" rx="2" fill="#f5b942"/>
    <text x="98" y="468" font-size="16" font-weight="700" fill="#f5f7ff">Company C</text><text x="98" y="490" font-size="14" fill="#a9b4d6">Compliance technology · 18 people · Pre-seed</text>
    <text x="98" y="512" font-size="13" fill="#7d89b3">Why: adjacent product, shared buyers, natural integration</text>
    <rect x="684" y="454" width="136" height="28" rx="14" fill="#41330f"/><text x="752" y="473" text-anchor="middle" font-size="13" font-weight="700" fill="#f5b942">Strategic partner</text>
  </g>
  <text x="74" y="566" font-size="13" fill="#7d89b3">27 more in the full list.  Push to HubSpot  ·  Export CSV  ·  Refine criteria</text>
  <text x="450" y="588" text-anchor="middle" font-size="11" fill="#55608a">Illustrative conversation, not actual Scoutly search results.</text>
  </g>
</svg>
