    <text x="60" y="110" font-size="30" font-weight="800" fill="#f5f7ff">Discover</text>
    <text x="60" y="146" font-size="16" fill="#a9b4d6">Find businesses in the markets,</text><text x="60" y="170" font-size="16" fill="#a9b4d6">industries and geographies you</text><text x="60" y="194" font-size="16" fill="#a9b4d6">want to enter.</text>
