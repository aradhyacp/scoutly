    <text x="455" y="72" font-size="14" font-weight="700" letter-spacing="3" fill="#818cf8">02</text>
    <text x="455" y="110" font-size="30" font-weight="800" fill="#f5f7ff">Qualify</text>
    <text x="455" y="146" font-size="16" fill="#a9b4d6">Research each company and match</text><text x="455" y="170" font-size="16" fill="#a9b4d6">it to your ideal customer profile,</text><text x="455" y="194" font-size="16" fill="#a9b4d6">with the reason it fits.</text>
